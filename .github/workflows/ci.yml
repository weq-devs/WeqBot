name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint / 护栏 / 类型 / 测试 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # `docs/` 是 submodule；下面的 `pnpm docs:build` 需要它。
          # submodule 是 public，默认 token 就够。
          submodules: recursive

      # 不写 version：从根 package.json 的 packageManager 读（pnpm@12.8.1）。
      - uses: pnpm/action-setup@v4

      # 与发布包里自带的 Node 同版本，CI 才算真跑过发布用的运行时。
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # Biome lint（`--error-on-warnings`）：warning 也拦，避免告警常态积累。
      - name: pnpm lint
        run: pnpm lint

      # 架构护栏 + 全量类型检查 + OneBot 文档快照 + 契约测试。
      - name: pnpm verify
        run: pnpm verify

      # 仓库公开，示例配置与测试里不该出现真实 QQ 号。
      - name: 真实账号检查
        run: pnpm anonymize:uin:check

      # 前端与文档站各自构建一遍：干净 clone 上构建不出来，发版时才发现的代价太大。
      - name: 构建 WebUI
        run: pnpm build:webui

      - name: 构建文档站
        run: pnpm docs:build
